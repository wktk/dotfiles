set-option -g mouse on
set-option -g focus-events on
# Stay in copy mode, at the same scroll position, after a mouse selection.
# copy-pipe-no-clear needs tmux 3.0+.
if-shell 'tmux -V | awk "{ exit !(\$2 + 0 >= 3.0) }"' \
    'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear'
set-option -g history-limit 10000

setw -g mode-keys vi
if-shell "uname | grep -q Darwin" "source-file ~/.tmux-pbcopy.conf"

set -g status-fg green
set -g status-bg black

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Show the battery only where one exists: on Linux without a battery,
# tmux-battery 2.0.0 prints a broken remaining time. Its battery_status prints
# nothing there. if-shell rather than #{==:...} works with old tmux (e.g. 2.3).
if-shell 'test -n "$(bash -c ". ~/.tmux/plugins/tmux-battery/scripts/helpers.sh && battery_status" 2> /dev/null)"' \
    'set-option -g status-right "#(~/.tmux/nosleep-status.sh)#{battery_percentage} #{battery_remain} | %m/%d %H:%M:%S"' \
    'set-option -g status-right "#(~/.tmux/nosleep-status.sh)%m/%d %H:%M:%S"'
set-option -g status-interval 1

# Use $SHELL
set-option -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

run-shell ~/.tmux/plugins/tmux-battery/battery.tmux

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# C-\ needs different escaping before and after tmux 3.0. `tmux -V` prints
# e.g. "tmux 3.5a"; awk reads the leading number of the second field.
if-shell -b 'tmux -V | awk "{ exit !(\$2 + 0 < 3.0) }"' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b 'tmux -V | awk "{ exit !(\$2 + 0 >= 3.0) }"' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
