# pbcopy & pbpaste
# Copies that name no command (mouse drag and clicks, y, Enter) pipe the
# selection to copy-command, so all of them reach the macOS clipboard.
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
